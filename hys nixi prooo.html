<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="صفحه رسمی HYS NIXI - لینک‌های ارتباطی" />
    <meta name="theme-color" content="#667eea" />
    <title>HYS NIXI</title>

    <style>
      /* ===== متغیرهای CSS ===== */
      :root {
        --primary: #667eea;
        --primary-dark: #764ba2;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text: #333333;
        --muted: #888888;
        --shadow: rgba(0, 0, 0, 0.25);
        --border: rgba(102, 126, 234, 0.2);
        --clock-bg: rgba(102, 126, 234, 0.1);
        --clock-border: rgba(102, 126, 234, 0.25);
      }

      body.dark {
        --card-bg: rgba(30, 30, 46, 0.95);
        --text: #eaeaea;
        --muted: #aaaaaa;
        --shadow: rgba(0, 0, 0, 0.6);
        --border: rgba(102, 126, 234, 0.4);
        --clock-bg: rgba(102, 126, 234, 0.18);
        --clock-border: rgba(102, 126, 234, 0.4);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ===== پس‌زمینه گرادیانتی متحرک ===== */
      body {
        font-family: Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
        background-size: 300% 300%;
        animation: gradientMove 15s ease infinite;
        transition: background 0.4s ease;
        overflow-x: hidden;
        position: relative;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* ===== کانواس ذرات ===== */
      #particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      /* ===== کارت ===== */
      .card {
        position: relative;
        z-index: 2;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 22px;
        padding: 30px 25px 25px;
        width: 100%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 15px 40px var(--shadow);
        border: 1px solid var(--border);
        transition:
          transform 0.3s ease,
          background 0.4s ease;
        animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes cardIn {
        0% {
          opacity: 0;
          transform: translateY(40px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ===== دکمه تم ===== */
      .theme-btn {
        position: absolute;
        top: 15px;
        left: 15px;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        background: var(--clock-bg);
        color: var(--text);
        font-size: 17px;
        cursor: pointer;
        transition:
          transform 0.3s,
          background 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }
      .theme-btn:hover {
        transform: rotate(25deg) scale(1.1);
        background: rgba(102, 126, 234, 0.3);
      }

      /* ===== ساعت و تاریخ ===== */
      .clock-box {
        position: absolute;
        top: 15px;
        right: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 6px 12px;
        background: var(--clock-bg);
        border: 1px solid var(--clock-border);
        border-radius: 14px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        animation: clockFadeIn 0.8s ease 0.3s both;
        box-shadow: inset 0 0 10px rgba(102, 126, 234, 0.1);
      }

      @keyframes clockFadeIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .clock-time {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: bold;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
        direction: ltr;
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .clock-time .sep {
        animation: blinkSep 1s infinite;
        color: var(--primary);
        font-weight: bold;
      }

      @keyframes blinkSep {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0.3;
        }
      }

      .clock-date {
        font-family: Arial, sans-serif;
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        direction: ltr;
      }

      /* ===== آواتار ===== */
      .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        margin: 25px auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        animation:
          float 3s ease-in-out infinite,
          pulse 4s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        50% {
          box-shadow: 0 8px 32px rgba(102, 126, 234, 0.9);
        }
      }

      /* ===== متن‌ها ===== */
      .card h2 {
        color: var(--text);
        margin-bottom: 8px;
        font-size: 26px;
        background: linear-gradient(
          90deg,
          var(--primary),
          var(--primary-dark),
          var(--primary)
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shine 3s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      #typingText {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 22px;
        min-height: 22px;
        line-height: 1.6;
      }

      #typingText::after {
        content: "|";
        animation: blink 0.8s infinite;
        color: var(--primary);
        margin-right: 2px;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }

      /* ===== دکمه‌ها ===== */
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 20px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: #fff;
        border-radius: 25px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        font-family: inherit;
        border: none;
        cursor: pointer;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
        opacity: 0;
        transform: translateY(15px);
        animation: btnIn 0.5s ease forwards;
        position: relative;
        overflow: hidden;
      }

      .btn:nth-child(1) {
        animation-delay: 0.3s;
      }
      .btn:nth-child(2) {
        animation-delay: 0.45s;
      }
      .btn:nth-child(3) {
        animation-delay: 0.6s;
      }
      .btn:nth-child(4) {
        animation-delay: 0.75s;
      }
      .btn:nth-child(5) {
        animation-delay: 0.9s;
      }

      @keyframes btnIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px rgba(102, 126, 234, 0.5);
      }

      .btn:active {
        transform: translateY(0) scale(0.98);
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        transition: right 0.6s;
      }

      .btn:hover::before {
        right: 100%;
      }

      /* ===== فوتر ===== */
      .footer {
        margin-top: 15px;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.7;
      }

      /* ===== کانفتی ===== */
      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        z-index: 9998;
        pointer-events: none;
        border-radius: 2px;
      }

      /* ===== ریسپانسیو ===== */
      @media (max-width: 400px) {
        .card {
          padding: 25px 18px 20px;
          border-radius: 18px;
        }

        .avatar {
          width: 90px;
          height: 90px;
          font-size: 50px;
          margin-top: 30px;
        }

        .card h2 {
          font-size: 22px;
        }
        .btn {
          font-size: 14px;
          padding: 12px 16px;
        }

        .clock-box {
          padding: 5px 9px;
          border-radius: 12px;
        }
        .clock-time {
          font-size: 12px;
        }
        .clock-date {
          font-size: 9px;
        }

        .theme-btn {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="particles"></canvas>

    <div class="card">
      <!-- دکمه تم -->
      <button
        class="theme-btn"
        id="themeBtn"
        title="تغییر تم"
        aria-label="تغییر تم"
      >
        🌙
      </button>

      <!-- ساعت و تاریخ -->
      <div class="clock-box">
        <div class="clock-time" id="clockTime">
          <span id="h">00</span><span class="sep">:</span><span id="m">00</span
          ><span class="sep">:</span><span id="s">00</span>
        </div>
        <div class="clock-date" id="clockDate">—</div>
      </div>

      <!-- آواتار و اطلاعات -->
      <div class="avatar">🍍</div>
      <h2>NIXI</h2>
      <p id="typingText"></p>

      <!-- دکمه‌ها -->
      <div class="buttons">
        <a
          href="https://www.aparat.com/hysnixi/live"
          class="btn"
          target="_blank"
          rel="noopener"
        >
          📺 آپارات
        </a>
        <a href="#" class="btn" target="_blank" rel="noopener"> ✈️ تلگرام </a>
        <a href="#" class="btn" target="_blank" rel="noopener">
          📷 اینستاگرام
        </a>
        <a href="#" class="btn" target="_blank" rel="noopener"> 🎬 یوتیوب </a>
        <a href="#" class="btn" target="_blank" rel="noopener"> 💬 واتساپ </a>
      </div>

      <div class="footer">© HYS NIXI</div>
    </div>

    <script>
      /* ========== ۱. تغییر تم ========== */
      const themeBtn = document.getElementById("themeBtn");
      const body = document.body;
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        body.classList.add("dark");
        themeBtn.textContent = "☀️";
      }

      themeBtn.addEventListener("click", () => {
        body.classList.toggle("dark");
        const isDark = body.classList.contains("dark");
        themeBtn.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });

      /* ========== ۲. ساعت و تاریخ زنده ========== */
      const hEl = document.getElementById("h");
      const mEl = document.getElementById("m");
      const sEl = document.getElementById("s");
      const dateEl = document.getElementById("clockDate");

      function updateClock() {
        const now = new Date();

        const h = now.getHours().toString().padStart(2, "0");
        const m = now.getMinutes().toString().padStart(2, "0");
        const s = now.getSeconds().toString().padStart(2, "0");

        hEl.textContent = h;
        mEl.textContent = m;
        sEl.textContent = s;

        // تاریخ به انگلیسی
        const dateStr = now.toLocaleDateString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        dateEl.textContent = dateStr;
      }

      updateClock();
      setInterval(updateClock, 1000);

      /* ========== ۳. افکت تایپ زنده ========== */
      const typingEl = document.getElementById("typingText");
      const messages = ["هیسسس نیکسییی", "خوش آمدی به صفحه من 🌟"];
      let msgIndex = 0;
      let charIndex = 0;
      let deleting = false;

      function type() {
        const current = messages[msgIndex];

        if (!deleting) {
          typingEl.textContent = current.substring(0, charIndex + 1);
          charIndex++;
          if (charIndex === current.length) {
            deleting = true;
            setTimeout(type, 1800);
            return;
          }
        } else {
          typingEl.textContent = current.substring(0, charIndex - 1);
          charIndex--;
          if (charIndex === 0) {
            deleting = false;
            msgIndex = (msgIndex + 1) % messages.length;
          }
        }
        setTimeout(type, deleting ? 50 : 100);
      }
      type();

      /* ========== ۴. کانفتی ========== */
      const colors = [
        "#667eea",
        "#764ba2",
        "#ff6b6b",
        "#feca57",
        "#48dbfb",
        "#1dd1a1",
      ];

      function createConfetti(x, y) {
        for (let i = 0; i < 30; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          c.style.left = x + "px";
          c.style.top = y + "px";
          c.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(c);

          const angle = Math.random() * Math.PI * 2;
          const velocity = 4 + Math.random() * 6;
          let posX = x,
            posY = y;
          let velX = Math.cos(angle) * velocity;
          let velY = Math.sin(angle) * velocity - 4;
          let rotation = Math.random() * 360;
          let life = 100;

          const interval = setInterval(() => {
            posX += velX;
            posY += velY;
            velY += 0.35;
            velX *= 0.99;
            rotation += 6;
            life--;

            c.style.left = posX + "px";
            c.style.top = posY + "px";
            c.style.transform = `rotate(${rotation}deg)`;
            c.style.opacity = life / 100;

            if (life <= 0 || posY > window.innerHeight) {
              clearInterval(interval);
              c.remove();
            }
          }, 16);
        }
      }

      document.querySelectorAll(".btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          createConfetti(e.clientX, e.clientY);
        });
      });

      /* ========== ۵. ذرات پس‌زمینه ========== */
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      let particles = [];
      const mouse = { x: null, y: null, radius: 120 };

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
      });

      window.addEventListener("mouseout", () => {
        mouse.x = null;
        mouse.y = null;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2.5 + 1;
          this.speedX = (Math.random() - 0.5) * 0.6;
          this.speedY = (Math.random() - 0.5) * 0.6;
          this.opacity = Math.random() * 0.5 + 0.3;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

          if (mouse.x != null && mouse.y != null) {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              this.x -= (dx / dist) * force * 2;
              this.y -= (dy / dist) * force * 2;
            }
          }
        }

        draw() {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function initParticles() {
        particles = [];
        const count = Math.min(
          80,
          Math.floor((canvas.width * canvas.height) / 18000),
        );
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
      }
      initParticles();
      window.addEventListener("resize", initParticles);

      function connectParticles() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        connectParticles();
        requestAnimationFrame(animate);
      }
      animate();

      console.log("✅ سایت HYS NIXI با موفقیت بارگذاری شد");
    </script>
  </body>
</html>
